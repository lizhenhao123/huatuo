name: huatuo

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    restart: unless-stopped
    network_mode: host
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./elasticsearch-jvm.options:/usr/share/elasticsearch/config/jvm.options:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u elastic:$${ELASTIC_PASSWORD}
          http://127.0.0.1:9200/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    cpus: 0.75

  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION}
    restart: unless-stopped
    network_mode: host
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN}
      GF_INSTALL_PLUGINS: >-
        yesoreyeram-infinity-datasource ${INFINITY_DATASOURCE_VERSION}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_ADDR: ${GRAFANA_LISTEN_ADDRESS:-127.0.0.1}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/huatuo.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/huatuo.yaml:ro
      - ../../build/docker/grafana/dashboards/continuous-profiling-host.json:/var/lib/huatuo-dashboards/continuous-profiling-host.json:ro
      - ../../build/docker/grafana/dashboards/continuous-profiling-container.json:/var/lib/huatuo-dashboards/continuous-profiling-container.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5

  huatuo-apiserver:
    image: ${HUATUO_IMAGE}:${HUATUO_IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    working_dir: /home/huatuo-bamai
    command:
      - ./bin/huatuo-apiserver
      - --config-dir
      - /etc/huatuo
      - --config
      - huatuo-apiserver.conf
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./runtime/huatuo-apiserver.conf:/etc/huatuo/huatuo-apiserver.conf:ro
      - apiserver-data:/var/lib/huatuo-apiserver
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:12740/readyz
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5

  huatuo-bamai:
    image: ${HUATUO_IMAGE}:${HUATUO_IMAGE_TAG}
    restart: unless-stopped
    privileged: true
    pid: host
    cgroup: host
    network_mode: host
    working_dir: /home/huatuo-bamai
    command:
      - ./bin/huatuo-bamai
      - --region
      - lighthouse
      - --config-dir
      - /etc/huatuo
      - --config
      - huatuo-bamai.conf
      - --disable-kubelet
    volumes:
      - /sys:/sys:rw
      - /proc:/proc:rw
      - /run:/run:rw
      - /etc:/etc:ro
      - /var:/var:ro
      - ./runtime/huatuo-bamai.conf:/etc/huatuo/huatuo-bamai.conf:ro
      - bamai-data:/var/lib/huatuo
    depends_on:
      elasticsearch:
        condition: service_healthy
      huatuo-apiserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:19704/readyz
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0

volumes:
  apiserver-data:
  bamai-data:
  elasticsearch-data:
  grafana-data:
