name: build latest docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main-images
  cancel-in-progress: false

jobs:
  buildx:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (static)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            huatuo/huatuo-bamai-static:latest
            huatuo/huatuo-bamai-static:sha-${{ github.sha }}
          cache-from: type=gha,scope=huatuo-static
          cache-to: type=gha,mode=max,scope=huatuo-static
          provenance: mode=max
          sbom: true

      - name: Build and push (nostatic)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          build-args: |
            BUILD_MODE=nostatic
          tags: |
            huatuo/huatuo-bamai:latest
            huatuo/huatuo-bamai:sha-${{ github.sha }}
          cache-from: type=gha,scope=huatuo-nostatic
          cache-to: type=gha,mode=max,scope=huatuo-nostatic
          provenance: mode=max
          sbom: true
